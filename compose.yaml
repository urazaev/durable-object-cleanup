services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: cleanup
      POSTGRES_PASSWORD: cleanup
      POSTGRES_DB: cleanup_test
    ports:
      - '127.0.0.1:55433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cleanup -d cleanup_test']
      interval: 2s
      timeout: 2s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
